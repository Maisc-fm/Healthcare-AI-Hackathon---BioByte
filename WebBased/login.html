<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Clinical Portal</title>
<!-- Tailwind CSS & Lucide Icons -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<!-- TriageAI Typography Imports -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --slate-bg: #f8fafc;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
  }
  
  /* Applying TriageAI typography rules */
  * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  
  body { background-color: var(--slate-bg); }

  .focus-ring:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 2px;
  }
</style>
</head>
<body class="min-h-screen text-slate-800 flex items-center justify-center p-0 sm:p-6 bg-slate-100">

  <!-- MAIN LOGIN CONTAINER (Split Layout) -->
  <div class="w-full max-w-5xl min-h-screen sm:min-h-[680px] bg-white rounded-none sm:rounded-3xl border border-slate-200 shadow-xl overflow-hidden grid grid-cols-1 lg:grid-cols-2">
    
    <!-- LEFT COLUMN: IMAGE BANNER -->
    <div class="relative bg-slate-900 hidden lg:flex flex-col justify-between p-8 overflow-hidden">
      <!-- Background Image -->
      <img src="login_bg.jpg" 
           alt="Medical Practitioner and Patient" 
           class="absolute inset-0 w-full h-full object-cover opacity-90">
      
      <!-- Subtle Overlay Gradient for better legibility -->
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/20 to-transparent"></div>

      <!-- Top Branding -->
      <div class="relative z-10 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-md">
          <i data-lucide="activity" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-lg font-extrabold text-white tracking-tight">MedSync <span class="text-blue-400">AI</span></span>
      </div>

      <!-- Bottom Caption -->
      <div class="relative z-10 text-white space-y-2">
        <h2 class="text-2xl font-extrabold tracking-tight">Clinical Staff Authentication</h2>
        <p class="text-xs text-slate-300 leading-relaxed max-w-sm">
          Secure, AI-assisted healthcare management platform. Please enter your authorized credentials to access clinical dashboards.
        </p>
      </div>
    </div>

    <!-- RIGHT COLUMN: CREDENTIALS FORM -->
    <div class="flex flex-col justify-between p-8 sm:p-12 lg:p-14 bg-white">
      
      <!-- Mobile Branding (Only visible on small screens) -->
      <div class="lg:hidden flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-md">
          <i data-lucide="activity" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-lg font-extrabold text-slate-900 tracking-tight">MedSync <span class="text-blue-600">AI</span></span>
      </div>

      <!-- Form Content -->
      <div class="my-auto space-y-6">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Sign In</h1>
          <p class="text-sm text-slate-500 mt-1">Enter your Doctor ID, IC number, and admin PIN to proceed.</p>
        </div>

        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
          
          <!-- Doctor ID Field -->
          <div>
            <label for="doctorId" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
              Doctor ID / License Number
            </label>
            <div class="relative">
              <input id="doctorId" type="text" required placeholder="e.g. DOC-115117"
                class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3 pl-11 text-sm outline-none focus:border-blue-600 transition mono" />
              <i data-lucide="stethoscope" class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5"></i>
            </div>
          </div>

          <!-- IC / ID Field -->
          <div>
            <label for="icNumber" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
              Patient's Identity Card (IC) / NRIC
            </label>
            <div class="relative">
              <input id="icNumber" type="text" required placeholder="e.g. 881024-13-5592"
                class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3 pl-11 text-sm outline-none focus:border-blue-600 transition mono" />
              <i data-lucide="id-card" class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5"></i>
            </div>
          </div>

          <!-- Admin PIN Field -->
          <div>
            <label for="adminPin" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
              Admin PIN
            </label>
            <div class="relative">
              <input id="adminPin" type="password" required maxlength="8" placeholder="••••••••"
                class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3 pl-11 text-sm outline-none focus:border-blue-600 transition mono" />
              <i data-lucide="lock" class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5"></i>
            </div>
          </div>

          <!-- Login Button -->
          <button type="submit"
            class="focus-ring w-full rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm sm:text-base py-3.5 flex items-center justify-center gap-2 shadow-sm transition mt-2">
            <span>Login</span>
            <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
        </form>
      </div>

      <!-- Footer Info -->
      <div class="pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400 mono">
        <span>System Version 2.4.0</span>
        <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i> Encrypted</span>
      </div>

    </div>

  </div>

<script>
lucide.createIcons();

function handleLogin(event) {
  event.preventDefault();
  // Navigates directly to the main dashboard hub page
  window.location.href = "page1.html";
}
</script>

</body>
</html>
